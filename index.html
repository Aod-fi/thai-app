<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thai lernen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Die App hat drei Ansichten. Immer nur eine ist sichtbar, die anderen haben "hidden". -->

  <!-- 1. Startseite mit Fortschritt -->
  <main id="view-home">
    <h1>Thai lernen</h1>
    <p id="voice-warning" class="warning" hidden>
      Keine Thai-Stimme gefunden. Lade sie unter Einstellungen → Bedienungshilfen →
      Gesprochene Inhalte → Stimmen → Thai → „Kanya (Erweitert)“.
    </p>

    <section class="panel">
      <div class="big-number" id="due-count">–</div>
      <div class="muted">Karten heute fällig</div>
    </section>

    <button id="start-button" class="primary big">Lernrunde starten</button>

    <section class="panel">
      <h2>Fortschritt</h2>
      <div id="boxes" class="boxes"></div>
      <p class="muted"><span id="streak">0</span> Lerntage in Folge</p>
    </section>

    <button id="overview-button" class="secondary big">Alle Karten ansehen</button>
    <p class="muted version">Version <span id="version"></span></p>
  </main>

  <!-- 2. Lernrunde -->
  <main id="view-round" hidden>
    <div class="topbar">
      <button id="round-close" class="link">✕ Beenden</button>
      <span id="round-counter" class="muted"></span>
    </div>

    <section class="card">
      <div id="card-badges" class="badges"></div>

      <!-- Vorderseite -->
      <div id="card-front">
        <p id="front-hint" class="muted"></p>
        <div id="front-text" class="front-text"></div>
        <button id="front-speak" class="secondary">🔊 Nochmal hören</button>
      </div>

      <!-- Rückseite -->
      <div id="card-back" hidden>
        <div id="back-umschrift" class="umschrift"></div>
        <div id="back-deutsch" class="deutsch"></div>
        <div id="back-merkhilfe" class="merkhilfe"></div>
        <div id="back-beispiel" class="beispiel"></div>
        <div class="speak-row">
          <button id="back-speak" class="secondary">▶ Normal</button>
          <button id="back-speak-slow" class="secondary">🐢 Langsam</button>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="flip-button" class="primary big">Umdrehen</button>
      <div id="rating-buttons" class="rating" hidden>
        <button data-rating="nochmal" class="again">Nochmal</button>
        <button data-rating="schwer" class="hard">Schwer</button>
        <button data-rating="gewusst" class="good">Gewusst</button>
      </div>
    </div>
  </main>

  <!-- 3. Übersicht aller Karten -->
  <main id="view-overview" hidden>
    <div class="topbar">
      <button id="overview-close" class="link">← Zurück</button>
    </div>
    <h1>Alle Karten</h1>
    <div id="overview-list"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
